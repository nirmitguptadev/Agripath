{% extends 'base.html' %}
{% load static %}

{% block title %}Verify OTP - AgriPath{% endblock %}

{% block content %}
<div class="container" style="display: flex; align-items: center; justify-content: center; min-height: 80vh;">
    <div class="auth-container">
        <h1 class="auth-title">Verify OTP</h1>
        <p style="margin-bottom: 2rem; color: var(--text-secondary);">An OTP has been sent to your mobile number.</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="{{ form.otp.id_for_label }}">Enter 6-Digit OTP</label>
                {{ form.otp }}
                {% if form.otp.errors %}
                <div class="error-message">{{ form.otp.errors.0 }}</div>
                {% endif %}
            </div>
            <button type="submit" class="submit-btn">Verify & Login</button>
        </form>
    </div>
</div>
{% endblock %}
